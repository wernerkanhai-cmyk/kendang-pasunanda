name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Een nieuwe push op dezelfde branch annuleert de vorige run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24 (zelfde versie als Vercel)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Dependencies installeren
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # De build draait bewust zonder VITE_*-secrets: die worden pas door
      # Vercel ingevuld. Slaagt de build hier, dan is de bundel zelf gezond.
      - name: Build
        run: npm run build

      # Niet-blokkerend: een nieuw gepubliceerde CVE mag de build niet 's nachts
      # rood maken. Verschijnt hier een waarschuwing, dan is er werk te doen.
      - name: Kwetsbaarheden in productie-dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
